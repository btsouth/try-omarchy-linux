# Try Omarchy for Linux: the launcher and the QEMU runtime it drives, as one
# Flatpak. QEMU and virglrenderer are upstream releases; the patches are the
# Windows runtime's file-drop event plus the Linux window behavior the
# launcher needs (close requests, keyboard grab on focus, window title).
# Mesa and the NVIDIA GL extension come from the Freedesktop runtime.
#
# Build with build-flatpak.sh beside this file.
app-id: com.tryomarchy.TryOmarchy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: try-omarchy
finish-args:
  - --device=kvm
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # QEMU's user-mode network (slirp) and the guest download.
  - --share=network
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: libslirp
    buildsystem: meson
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.bz2
        sha256: 3caff6e2de445f4995629d4929c55419f661b2b1d14f12481e155a71c1e8f811

  # virglrenderer's gallium format tables are generated with PyYAML, which
  # the SDK lacks. Needed at build time only.
  - name: pyyaml
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz
        sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f

  - name: virglrenderer
    buildsystem: meson
    build-options:
      env:
        PYTHONPATH: /app/lib/python3.13/site-packages
    config-opts:
      - -Dplatforms=egl
      - -Dvenus=true
      - -Dvideo=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/virgl/virglrenderer/-/archive/1.3.0/virglrenderer-1.3.0.tar.bz2
        sha256: 088040d130eaa0458a978fe7867fbfb1fcf1fdff52bf3b27a00658828bc4189f

  - name: qemu
    buildsystem: simple
    build-commands:
      - >-
        ./configure --prefix=/app --target-list=x86_64-softmmu
        --enable-kvm --enable-sdl --enable-opengl --enable-virglrenderer
        --enable-pipewire --enable-slirp --enable-virtfs --enable-tools
        --audio-drv-list=pipewire,sdl
        --disable-gtk --disable-spice --disable-xen --disable-user
        --disable-docs --disable-werror --disable-modules --disable-download
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    cleanup:
      - /share/applications
      - /share/icons
    sources:
      - type: archive
        url: https://download.qemu.org/qemu-11.1.1.tar.xz
        sha256: 079ffbff8a7111bbc89022107cbabf3bbfd614d5fc9d7cc675991196aca12482
      - type: patch
        path: ../patches/qemu/0007-report-native-file-drops.patch
      - type: patch
        path: patches/qemu/0101-report-sdl-close-requests.patch
      - type: patch
        path: patches/qemu/0102-grab-keyboard-while-sdl-window-has-focus.patch
      - type: patch
        path: patches/qemu/0103-title-sdl-windows-with-the-vm-name.patch

  # The launcher, built offline with a pinned Go toolchain and its one
  # module dependency served from a local module proxy.
  - name: try-omarchy
    buildsystem: simple
    build-options:
      env:
        CGO_ENABLED: '0'
        GOTOOLCHAIN: local
        GOFLAGS: -mod=mod -trimpath
        GOSUMDB: 'off'
    build-commands:
      - echo v1.19.2 > goproxy/github.com/klauspost/compress/@v/list
      - >-
        cd app && PATH="$PWD/../go/bin:$PATH" GOPROXY="file://$PWD/../goproxy"
        GOCACHE="$PWD/../.gocache" GOMODCACHE="$PWD/../.gomodcache"
        go build -o ${FLATPAK_DEST}/bin/try-omarchy .
      - install -Dm644 com.tryomarchy.TryOmarchy.desktop ${FLATPAK_DEST}/share/applications/com.tryomarchy.TryOmarchy.desktop
      - install -Dm644 app/OmarchyIcon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.tryomarchy.TryOmarchy.svg
      - install -Dm644 com.tryomarchy.TryOmarchy.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.tryomarchy.TryOmarchy.metainfo.xml
    sources:
      - type: dir
        path: ../../app
        dest: app
      - type: archive
        url: https://go.dev/dl/go1.27.1.linux-amd64.tar.gz
        sha256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
        dest: go
      - type: file
        url: https://proxy.golang.org/github.com/klauspost/compress/@v/v1.19.2.zip
        sha256: 3b3a3540125ad9b3ae1ab0f5df06ac32d11b8330c3140f977d213e0f6df482e9
        dest: goproxy/github.com/klauspost/compress/@v
      - type: file
        url: https://proxy.golang.org/github.com/klauspost/compress/@v/v1.19.2.mod
        sha256: 0d66d6069d9e2fb875c5b464d15b2c80232cfc8991e6f88336ce461ca810e0cf
        dest: goproxy/github.com/klauspost/compress/@v
      - type: file
        url: https://proxy.golang.org/github.com/klauspost/compress/@v/v1.19.2.info
        sha256: 5e3b5cb3043d2d29baa88fc57b9119461897f05805cd72d506e68540d40b50a8
        dest: goproxy/github.com/klauspost/compress/@v
      - type: file
        path: com.tryomarchy.TryOmarchy.desktop
      - type: file
        path: com.tryomarchy.TryOmarchy.metainfo.xml
